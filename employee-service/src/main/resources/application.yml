spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false       # OFF by default — enable via 'dev' profile
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

# Base URL for the department-service — change host/port for each environment
department:
  service:
    base-url: http://localhost:8081

---
# Activate with: --spring.profiles.active=dev
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true


